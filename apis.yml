name: Nilo Therapeutics
description: >-
  Nilo Therapeutics is a New York-based, preclinical-stage biotechnology company
  pioneering a differentiated approach to immunomodulation by targeting the neural
  circuits that regulate systemic inflammation. Building on seminal discoveries from
  the laboratories of Charles Zuker (Columbia University / HHMI), Ruslan Medzhitov
  (Yale), and Stephen Liberles (Harvard) that identified vagal neurons regulating
  systemic immune activation, and led by CEO Kim Seth, the company harnesses the
  body-brain axis to restore immune homeostasis centrally, moving beyond conventional
  immunosuppression to treat autoimmune and inflammatory disease. Nilo launched in
  2025 with a $101M Series A co-led by DCVC Bio, Lux Capital, and The Column Group,
  with participation from Alexandria Venture Investments and the Gates Foundation. As
  a therapeutics company it publishes no public developer API, SDK, or developer
  portal surface.
